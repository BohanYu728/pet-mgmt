server:
  port: 8080

spring:
  application:
    name: pet-mgmt-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_mgmt_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/static/

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:true}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# File upload
upload:
  path: uploads
  allowed-extensions: jpg,jpeg,png,webp

# AI / LLM Configuration
llm:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${LLM_API_KEY:}
  model: deepseek-chat

logging:
  level:
    com.petmgmt: DEBUG
    org.springframework.security: INFO

