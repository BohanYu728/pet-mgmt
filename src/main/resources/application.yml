server:
  port: 8080

spring:
  application:
    name: pet-mgmt-system

  datasource:
    url: jdbc:mysql://localhost:3306/pet_mgmt_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/static/

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

# File upload
upload:
  path: uploads
  allowed-extensions: jpg,jpeg,png,webp

# AI / LLM Configuration
llm:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${LLM_API_KEY:}
  model: deepseek-chat

logging:
  level:
    com.petmgmt: DEBUG
    org.springframework.security: INFO

