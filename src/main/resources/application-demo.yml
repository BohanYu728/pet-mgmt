spring:
  datasource:
    url: jdbc:h2:mem:petmgmt;MODE=MySQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-demo.sql
jwt:
  secret: ${JWT_SECRET:local-demo-only-secret-for-petmgmt-32-characters}
app:
  cookie-secure: false
