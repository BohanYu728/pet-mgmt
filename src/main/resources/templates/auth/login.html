<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>登录</title>
<style>
.role-tabs { background: #f1f3f5; border-radius: 12px; padding: 4px; }
.role-tab { border-radius: 10px; padding: 10px 16px; font-weight: 600; border: none; background: transparent; cursor: pointer; transition: all .2s; color: #6c757d; }
.role-tab.active-user { background: #4361ee; color: #fff; }
.role-tab.active-merchant { background: #f77f00; color: #fff; }
.role-tab.active-admin { background: #d62828; color: #fff; }
.login-card { border-radius: 16px; }
</style>
</head>
<body>
<div layout:fragment="content">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-heart-fill text-primary fs-1"></i>
                <h3 class="fw-bold mt-2">欢迎回来</h3>
                <p class="text-muted" id="loginDesc">登录您的宠物管家账号</p>
            </div>
            <!-- 三个角色切换 -->
            <div class="d-flex mb-4 role-tabs">
                <button class="role-tab flex-fill active-user" id="userTab" onclick="switchRole('user')"><i class="bi bi-person me-1"></i> 普通用户</button>
                <button class="role-tab flex-fill" id="merchantTab" onclick="switchRole('merchant')"><i class="bi bi-shop me-1"></i> 商户</button>
                <button class="role-tab flex-fill" id="adminTab" onclick="switchRole('admin')"><i class="bi bi-shield-check me-1"></i> 管理员</button>
            </div>
            <div class="card border-0 shadow-sm login-card">
                <div class="card-body p-4">
                    <div id="loginAlert" class="alert alert-danger d-none py-2 small"></div>
                    <form id="loginForm">
                        <input type="hidden" id="loginRole" value="user">
                        <div class="mb-3">
                            <label class="form-label small fw-bold"><i class="bi bi-person me-1"></i>用户名</label>
                            <input type="text" class="form-control" id="username" required autofocus placeholder="请输入用户名">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold"><i class="bi bi-lock me-1"></i>密码</label>
                            <input type="password" class="form-control" id="password" required placeholder="请输入密码">
                        </div>
                        <button type="submit" class="btn w-100 py-2 fw-bold" id="loginBtn">
                            <span id="loginText"><i class="bi bi-box-arrow-in-right me-1"></i> 登录</span>
                        </button>
                    </form>
                    <div class="text-center mt-3" id="regLink"><small class="text-muted">还没有账号？</small> <a href="/auth/register" class="fw-bold text-primary">立即注册</a></div>
                    <div class="text-center mt-3 d-none" id="merchantLink"><small class="text-muted">商户入驻？</small> <a href="/auth/register" class="fw-bold text-warning">申请入驻</a></div>
                    <div class="text-center mt-3 d-none" id="adminLink"><small class="text-muted">管理员账号由系统指定，不支持自主注册</small></div>
                    <hr class="my-3">
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-secondary btn-sm" onclick="quickLogin('demo','demo123','user')"><i class="bi bi-person-check me-1"></i> Demo 用户登录</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="quickLogin('admin','admin123','admin')"><i class="bi bi-shield-check me-1"></i> Admin 管理员登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
let currentRole = 'user';
function switchRole(role) {
    currentRole = role;
    ['user','merchant','admin'].forEach(r => {
        const tab = document.getElementById(r+'Tab');
        tab.classList.remove('active-user','active-merchant','active-admin');
        if (r === role) tab.classList.add('active-'+role);
    });
    document.getElementById('loginRole').value = role;
    const descs = { user:'登录您的宠物管家账号', merchant:'商户管理后台登录', admin:'平台管理员登录' };
    document.getElementById('loginDesc').textContent = descs[role];
    document.getElementById('regLink').classList.toggle('d-none', role !== 'user');
    document.getElementById('merchantLink').classList.toggle('d-none', role !== 'merchant');
    document.getElementById('adminLink').classList.toggle('d-none', role !== 'admin');
    const btn = document.getElementById('loginBtn');
    btn.classList.remove('btn-primary','btn-warning','btn-danger');
    btn.classList.add({user:'btn-primary',merchant:'btn-warning',admin:'btn-danger'}[role]);
    document.getElementById('loginText').innerHTML = {
        user:'<i class="bi bi-box-arrow-in-right me-1"></i> 登录',
        merchant:'<i class="bi bi-shop me-1"></i> 商户登录',
        admin:'<i class="bi bi-shield-check me-1"></i> 管理员登录'
    }[role];
}
switchRole('user');

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn'), alert = document.getElementById('loginAlert');
    btn.disabled = true; alert.classList.add('d-none');
    try {
        const csrf = await fetch('/api/auth/csrf').then(r => r.json());
        const res = await fetch('/api/auth/login', {
            method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', [csrf.headerName]: csrf.token },
            body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value, role: currentRole })
        });
        const data = await res.json();
        if (data.error) {
            alert.textContent = data.error; alert.classList.remove('d-none');
        } else {
            const dest = data.data.user.role === 'merchant' ? '/merchant' : data.data.user.role === 'admin' ? '/admin' : '/dashboard';
            location.href = dest;
        }
    } catch(e) { alert.textContent = '网络错误'; alert.classList.remove('d-none'); }
    btn.disabled = false;
});

async function quickLogin(u, p, role) {
    currentRole = role; switchRole(role);
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
}
</script>
</div>
</body>
</html>
