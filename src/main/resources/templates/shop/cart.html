<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>购物车</title></head>
<body><div layout:fragment="content"><div class="container py-4"><h2 class="mb-4"><i class="bi bi-cart me-2"></i>购物车</h2>
<div id="cart"><div class="text-center py-5"><div class="spinner-border"></div></div></div></div>
<script th:inline="javascript">const T=getToken();
fetch('/api/shop/api/cart',{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{
    const el=document.getElementById('cart');
    if(!d.items||d.items.length===0){el.innerHTML='<div class="text-center py-5 text-muted"><i class="bi bi-cart-x fs-1 d-block mb-2"></i>购物车是空的，<a href="/shop">去逛逛</a></div>';return;}
    el.innerHTML=`<div class="table-responsive"><table class="table"><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th></th></tr></thead><tbody>
    ${d.items.map(i=>`<tr><td>${i.product?.name||'商品'}</td><td>¥${i.product?.price?.toFixed(2)}</td><td>${i.quantity}</td><td>¥${(i.product?.price*i.quantity).toFixed(2)}</td><td><button class="btn btn-danger btn-sm" onclick="removeItem(${i.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')}</tbody></table></div>
    <div class="text-end"><h4>合计: ¥${d.total_amount.toFixed(2)}</h4>
    <button class="btn btn-primary btn-lg" onclick="checkout()"><i class="bi bi-credit-card me-1"></i>去结算</button></div>`;
});
async function removeItem(id){await fetch('/api/shop/api/cart/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+T}});location.reload();}
async function checkout(){const r=await fetch('/api/shop/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+T},body:JSON.stringify({recipient_name:'买家',recipient_phone:'13800000000',address_province:'北京',address_city:'北京',address_district:'朝阳',address_detail:'测试地址'})});const j=await r.json();alert(j.message||j.error);if(j.message)location.href='/shop/orders';}
function getToken(){return localStorage.getItem('token')||document.cookie.split('; ').find(r=>r.startsWith('token='))?.split('=')[1]||'';}</script></div></body></html>
