<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>AI 情绪分析</title></head>
<body><div layout:fragment="content"><div class="container py-4">
<div class="text-center mb-4"><i class="bi bi-emoji-smile fs-1 text-success"></i><h2 class="fw-bold mt-2">AI 情绪分析</h2><p class="text-muted">上传宠物照片，分析宠物当前情绪状态并获得安抚建议</p></div>
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<div class="mb-3"><label class="form-label">选择宠物 <span class="text-danger">*</span></label><select id="petSelect" class="form-select" required><option value="">请选择...</option></select></div>
<div class="mb-3"><label class="form-label">上传照片</label>
<div class="border border-2 border-dashed rounded-3 p-4 text-center bg-light" id="dropZone" style="cursor:pointer">
    <i class="bi bi-cloud-upload fs-1 text-muted d-block mb-2"></i>
    <p class="text-muted mb-1">点击或拖拽照片到此处</p>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
</div><img id="preview" class="img-fluid rounded-3 mt-3" style="max-height:300px;display:none"></div>
<button class="btn btn-success w-100" id="analyzeBtn" disabled><i class="bi bi-emoji-smile me-1"></i>分析情绪</button>
<div id="result" class="mt-4" style="display:none"></div>
</div></div></div></div></div>
<script>const T=getToken();
fetch('/api/pets?page=1',{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{document.getElementById('petSelect').innerHTML+='<option value="">请选择...</option>'+d.pets.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');});
const drop=document.getElementById('dropZone'),input=document.getElementById('imageInput'),preview=document.getElementById('preview'),btn=document.getElementById('analyzeBtn');
drop.addEventListener('click',()=>input.click());drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('border-success')});drop.addEventListener('dragleave',()=>drop.classList.remove('border-success'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('border-success');if(e.dataTransfer.files[0]){input.files=e.dataTransfer.files;handleFile(e.dataTransfer.files[0])}});
input.addEventListener('change',()=>{if(input.files[0])handleFile(input.files[0])});
function handleFile(file){const r=new FileReader();r.onload=e=>{preview.src=e.target.result;preview.style.display='block';btn.disabled=false};r.readAsDataURL(file)}
btn.addEventListener('click',async()=>{btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>分析中...';const fd=new FormData();fd.append('image',input.files[0]);fd.append('petId',document.getElementById('petSelect').value);
const r=await fetch('/api/ai/emotion/recognize',{method:'POST',headers:{'Authorization':'Bearer '+T},body:fd});const j=await r.json();
document.getElementById('result').style.display='block';
if(j.error){document.getElementById('result').innerHTML=`<div class="alert alert-danger">${j.error}</div>`}else{
const emoColors={开心:'success',放松:'primary',警惕:'warning',焦虑:'danger',害怕:'danger',疲惫:'info',伤心:'secondary'};
const emoIcons={开心:'emoji-smile',放松:'emoji-neutral',警惕:'emoji-expressionless',焦虑:'emoji-frown',害怕:'emoji-dizzy',疲惫:'emoji-neutral',伤心:'emoji-tear'};
const color=emoColors[j.emotion_zh]||'primary',icon=emoIcons[j.emotion_zh]||'emoji-neutral';
document.getElementById('result').innerHTML=`<div class="card bg-light"><div class="card-body text-center"><div class="rounded-circle bg-${color} bg-opacity-10 d-inline-flex p-4 mb-3"><i class="bi bi-${icon} fs-1 text-${color}"></i></div><h3 class="text-${color}">${j.emotion_zh}</h3><p class="text-muted">置信度: <b>${j.confidence}%</b></p><hr><h6 class="text-start"><i class="bi bi-chat-heart me-1"></i>安抚建议</h6><p class="text-start">${j.comfort_advice}</p><hr><h6 class="text-start small text-muted">各情绪评分</h6><div class="row g-2">${Object.entries(j.scores||{}).map(([k,v])=>`<div class="col-6"><div class="d-flex justify-content-between small"><span>${k}</span><span>${v}%</span></div><div class="progress" style="height:6px"><div class="progress-bar bg-${emoColors[k]||'primary'}" style="width:${v}%"></div></div></div>`).join('')}</div></div></div>`;}btn.innerHTML='<i class="bi bi-emoji-smile me-1"></i>分析情绪';btn.disabled=false;});</script></div></body></html>
