<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>宠物相册</title></head>
<body><div layout:fragment="content"><div class="container py-4">
<h2 class="mb-4"><i class="bi bi-images me-2"></i>宠物相册</h2>
<div class="mb-4"><select id="petSelect" class="form-select w-auto d-inline-block"><option value="">选择宠物...</option></select></div>
<div id="gallery"><div class="text-center py-5 text-muted"><i class="bi bi-camera fs-1 d-block mb-2"></i>选择宠物查看相册</div></div></div>
<script th:inline="javascript">const T=getToken();
fetch('/api/pets?page=1',{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{
    document.getElementById('petSelect').innerHTML+='<option value="">选择宠物...</option>'+d.pets.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('petSelect').onchange=function(){if(this.value)loadGallery(this.value);};
});
async function loadGallery(petId){
    document.getElementById('gallery').innerHTML='<div class="text-center py-5"><div class="spinner-border"></div></div>';
    const r=await fetch('/api/pets/'+petId,{headers:{'Authorization':'Bearer '+T}}); const d=await r.json(); const p=d.pet;
    let html=`<div class="mb-3"><strong>${p.name}</strong> 的相册</div>
    <div class="mb-3"><input type="file" id="photoUpload" accept="image/*" class="form-control w-auto d-inline-block"><button class="btn btn-primary ms-2" onclick="uploadPhoto(${petId})"><i class="bi bi-cloud-upload me-1"></i>上传</button></div>
    <div class="row g-3">`;
    if(p.avatar){html+=`<div class="col-md-3"><div class="card"><img src="/${p.avatar}" class="card-img-top" style="height:200px;object-fit:cover"><div class="card-body p-2 text-center"><small class="text-muted">头像</small></div></div></div>`;}
    html+='</div>'; document.getElementById('gallery').innerHTML=html;
}
async function uploadPhoto(petId){const f=document.getElementById('photoUpload').files[0];if(!f)return;const fd=new FormData();fd.append('avatar',f);const r=await fetch('/api/pets/'+petId+'/avatar',{method:'POST',headers:{'Authorization':'Bearer '+T},body:fd});const j=await r.json();j.message?loadGallery(petId):alert(j.error);}
function getToken(){return null||null||'';}</script></div></body></html>
