<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>我的宠物</title></head>
<body><div layout:fragment="content"><div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0"><i class="bi bi-house-heart me-2"></i>我的宠物</h2><a href="/pets/add" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>添加宠物</a></div>
<div class="row g-4" id="petList"><div class="col-12 text-center py-5"><div class="spinner-border"></div></div></div></div>
<script th:inline="javascript">const t=getToken();
fetch('/api/pets?page=1',{headers:{'Authorization':'Bearer '+t}}).then(r=>r.json()).then(d=>{
    const el=document.getElementById('petList');
    if(!d.pets||d.pets.length===0){el.innerHTML='<div class="col-12 text-center py-5 text-muted"><i class="bi bi-inbox fs-1 d-block mb-2"></i>暂无宠物，<a href="/pets/add">去添加</a></div>';return;}
    el.innerHTML=d.pets.map(p=>{
        const avatar=p.avatar?`<img src="/${p.avatar}" class="rounded-circle" style="width:80px;height:80px;object-fit:cover" onerror="this.style.display='none'">`:`<div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex p-3" style="width:80px;height:80px"><i class="bi fs-2 ${p.species==='dog'?'bi-dog text-warning':'bi-cat text-info'} m-auto"></i></div>`;
        return `<div class="col-md-3"><div class="card h-100 border-0 shadow-sm"><div class="card-body text-center">
        <div class="mb-3">${avatar}</div>
        <h5 class="mb-1">${p.name}</h5><p class="text-muted small mb-1">${p.breed||'未知品种'}</p>
        <p class="text-muted small mb-2">${p.age_display||(p.age?p.age+'岁':'')} · ${p.weight}kg · ${p.color||''}</p>
        <div class="d-flex gap-1 justify-content-center">
            <a href="/pets/${p.id}" class="btn btn-outline-primary btn-sm">详情</a>
            <a href="/health/pet/${p.id}" class="btn btn-outline-success btn-sm">健康</a>
            <button class="btn btn-outline-danger btn-sm" onclick="if(confirm('确定删除?'))fetch('/api/pets/'+${p.id},{method:'DELETE',headers:{'Authorization':'Bearer '+t}}).then(()=>location.reload())"><i class="bi bi-trash"></i></button>
        </div></div></div></div>`;
    }).join('');
});
function getToken(){return null||null||'';}</script></div></body></html>
