<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>宠物详情</title></head>
<body><div layout:fragment="content"><div class="container py-4" id="app"><div class="text-center py-5"><div class="spinner-border"></div></div></div>
<script th:inline="javascript">const T=getToken();const id=location.pathname.split('/').pop();
fetch('/api/pets/'+id,{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{const p=d.pet;
const avatar=p.avatar?`<img src="/${p.avatar}" class="rounded-circle" style="width:80px;height:80px;object-fit:cover" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center\\' style=\\'width:80px;height:80px\\'><i class=\\'bi fs-1 ${p.species===\\'dog\\'?\\'bi-dog text-warning\\':\\'bi-cat text-info\\'}\\'></i></div>'">`:`<div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center" style="width:80px;height:80px"><i class="bi fs-1 ${p.species==='dog'?'bi-dog text-warning':'bi-cat text-info'}"></i></div>`;
document.getElementById('app').innerHTML=`<div class="row"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<div class="d-flex align-items-center gap-3 mb-3">${avatar}<div><h3 class="mb-0">${p.name}</h3><p class="text-muted mb-0">${p.breed||'未知品种'} · ${p.gender==='male'?'公':p.gender==='female'?'母':'未知'} · ${p.age_display||(p.age?p.age+'岁':'年龄未知')}</p></div></div><hr>
<div class="row g-3"><div class="col-4"><small class="text-muted">体重</small><div class="fw-bold">${p.weight||'?'} kg</div></div><div class="col-4"><small class="text-muted">颜色</small><div class="fw-bold">${p.color||'未知'}</div></div><div class="col-4"><small class="text-muted">出生日期</small><div class="fw-bold">${p.birth_date||'未知'}</div></div></div>
${p.description?`<hr><p class="text-muted">${p.description}</p>`:''}
<div class="mt-3 d-flex gap-2"><a href="/health/pet/${p.id}" class="btn btn-outline-success"><i class="bi bi-clipboard2-heart me-1"></i>健康记录</a><a href="/ai/health-report" class="btn btn-outline-info"><i class="bi bi-cpu me-1"></i>AI 报告</a><button class="btn btn-outline-primary" id="uploadBtn"><i class="bi bi-camera me-1"></i>上传头像</button><input type="file" id="avatarInput" accept="image/*" style="display:none"></div></div></div></div></div>`;
document.getElementById('uploadBtn').onclick=()=>document.getElementById('avatarInput').click();
document.getElementById('avatarInput').onchange=async function(){const f=this.files[0];if(!f)return;const fd=new FormData();fd.append('avatar',f);const r=await fetch('/api/pets/'+id+'/avatar',{method:'POST',headers:{'Authorization':'Bearer '+T},body:fd});const j=await r.json();if(j.message){location.reload()}else alert(j.error)};});function getToken(){return localStorage.getItem('token')||document.cookie.split('; ').find(r=>r.startsWith('token='))?.split('=')[1]||'';}</script></div></body></html>
