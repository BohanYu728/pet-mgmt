<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>商户管理</title></head>
<body><div layout:fragment="content"><div class="container py-4"><h2 class="mb-4"><i class="bi bi-building me-2"></i>商户管理</h2>
<div id="table"><div class="text-center py-5"><div class="spinner-border"></div></div></div></div>
<script th:inline="javascript">const T=getToken();
fetch('/api/admin/merchants/list',{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{
    document.getElementById('table').innerHTML=`<table class="table table-hover"><thead><tr><th>ID</th><th>店铺</th><th>用户名</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.merchants.map(m=>`<tr><td>${m.id}</td><td>${m.store_name||''}</td><td>${m.username}</td><td>${m.is_approved?'已审核':'待审核'}</td><td>${!m.is_approved?`<button class="btn btn-success btn-sm" onclick="approve(${m.id})">审核通过</button>`:''}</td></tr>`).join('')}</tbody></table>`;
});
async function approve(id){await fetch('/api/admin/merchants/'+id+'/approve',{method:'POST',headers:{'Authorization':'Bearer '+T}});location.reload();}
function getToken(){return localStorage.getItem('token')||document.cookie.split('; ').find(r=>r.startsWith('token='))?.split('=')[1]||'';}</script></div></body></html>
