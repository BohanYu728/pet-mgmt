<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>宠物管理</title></head>
<body><div layout:fragment="content"><div class="container py-4"><h2 class="mb-4"><i class="bi bi-heart me-2"></i>宠物管理</h2>
<div id="table"><div class="text-center py-5"><div class="spinner-border"></div></div></div></div>
<script th:inline="javascript">const T=getToken();
fetch('/api/admin/pets/list',{headers:{'Authorization':'Bearer '+T}}).then(r=>r.json()).then(d=>{
    document.getElementById('table').innerHTML=`<table class="table table-hover"><thead><tr><th>ID</th><th>名字</th><th>主人</th><th>品种</th><th>操作</th></tr></thead><tbody>${d.pets.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.owner_name||''}</td><td>${p.breed||''}</td><td><button class="btn btn-danger btn-sm" onclick="delPet(${p.id})">删除</button></td></tr>`).join('')}</tbody></table>`;
});
async function delPet(id){if(!confirm('确定删除?'))return;await fetch('/api/admin/pets/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+T}});location.reload();}
function getToken(){return null||null||'';}</script></div></body></html>
